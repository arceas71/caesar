<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Caesar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Splash -->

    <div id="splash-screen">
        <div class="splash-mark">C</div>
        <div class="splash-name">Caesar</div>
    </div>


    <!-- App -->

    <div id="app">

        <header class="chat-header">

            <div class="brand">
                <div class="brand-mark">C</div>
                <span>Caesar</span>
            </div>

        </header>


        <main id="chat" aria-live="polite">

            <div id="welcome">

                <div class="welcome-mark">C</div>

                <h1>Caesar</h1>

                <p>
                    A conversation with your future self.
                </p>

            </div>

        </main>


        <!-- Context menu -->

        <div
            id="message-menu"
            class="message-menu"
            role="menu"
        >

            <button
                type="button"
                data-action="reply"
            >
                Reply
            </button>

            <button
                type="button"
                data-action="react"
            >
                React
            </button>

            <div class="menu-divider"></div>

            <button
                type="button"
                data-action="delete-me"
            >
                Delete for me
            </button>

            <button
                type="button"
                data-action="delete-everyone"
                class="danger-action"
            >
                Delete for everyone
            </button>

        </div>


        <!-- Reply preview -->

        <div
            id="reply-preview"
            class="reply-preview"
        >

            <div class="reply-preview-content">

                <span class="reply-preview-label">
                    Replying to
                </span>

                <span id="reply-preview-text"></span>

            </div>

            <button
                type="button"
                id="cancel-reply"
                aria-label="Cancel reply"
            >
                ×
            </button>

        </div>


        <!-- Composer -->

        <div class="composer-wrapper">

            <form
                id="message-form"
                autocomplete="off"
            >

                <input
                    type="text"
                    id="message-input"
                    placeholder="Message Caesar"
                    aria-label="Message Caesar"
                    maxlength="4000"
                >

                <button
                    type="submit"
                    id="send-button"
                    aria-label="Send message"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M12 19V5"></path>
                        <path d="M6.5 11.5L12 5L17.5 11.5"></path>
                    </svg>

                </button>

            </form>

        </div>

    </div>


    <script
        type="module"
        src="app.js"
    ></script>

</body>
</html>
